<svg xmlns="http://www.w3.org/2000/svg" width="360" height="662" viewBox="0 0 360 662" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#555"/></marker></defs>
<rect width="100%" height="100%" fill="#fff"/>
<rect x="20" y="20" width="320" height="46" rx="4" fill="#f7f7f7" stroke="#bbb"/>
<text x="180.0" y="39" text-anchor="middle" font-size="13" fill="#111">Input</text>
<text x="180.0" y="55" text-anchor="middle" font-size="11" fill="#555">one-hot 21 x 4</text>
<line x1="180.0" y1="66" x2="180.0" y2="86" stroke="#555" stroke-width="1.4" marker-end="url(#a)"/>
<rect x="20" y="92" width="320" height="46" rx="4" fill="#f7f7f7" stroke="#bbb"/>
<text x="180.0" y="111" text-anchor="middle" font-size="13" fill="#111">Embedding</text>
<text x="180.0" y="127" text-anchor="middle" font-size="11" fill="#555">4 -> 128 per position</text>
<line x1="180.0" y1="138" x2="180.0" y2="158" stroke="#555" stroke-width="1.4" marker-end="url(#a)"/>
<rect x="20" y="164" width="320" height="46" rx="4" fill="#f7f7f7" stroke="#bbb"/>
<text x="180.0" y="183" text-anchor="middle" font-size="13" fill="#111">3 x Conv1D</text>
<text x="180.0" y="199" text-anchor="middle" font-size="11" fill="#555">128 filters, k=3, s=1, p=1, ReLU</text>
<line x1="180.0" y1="210" x2="180.0" y2="230" stroke="#555" stroke-width="1.4" marker-end="url(#a)"/>
<rect x="20" y="236" width="320" height="46" rx="4" fill="#f7f7f7" stroke="#bbb"/>
<text x="180.0" y="255" text-anchor="middle" font-size="13" fill="#111">3 x BiLSTM</text>
<text x="180.0" y="271" text-anchor="middle" font-size="11" fill="#555">128 hidden units</text>
<line x1="180.0" y1="282" x2="180.0" y2="302" stroke="#555" stroke-width="1.4" marker-end="url(#a)"/>
<rect x="20" y="308" width="320" height="46" rx="4" fill="#f7f7f7" stroke="#bbb"/>
<text x="180.0" y="327" text-anchor="middle" font-size="13" fill="#111">CNN branch readout</text>
<text x="180.0" y="343" text-anchor="middle" font-size="11" fill="#555">128 x 21 -> 128</text>
<line x1="180.0" y1="354" x2="180.0" y2="374" stroke="#555" stroke-width="1.4" marker-end="url(#a)"/>
<rect x="20" y="380" width="320" height="46" rx="4" fill="#f7f7f7" stroke="#bbb"/>
<text x="180.0" y="399" text-anchor="middle" font-size="13" fill="#111">Concatenate branches</text>
<text x="180.0" y="415" text-anchor="middle" font-size="11" fill="#555">128 + 128 = 256</text>
<line x1="180.0" y1="426" x2="180.0" y2="446" stroke="#555" stroke-width="1.4" marker-end="url(#a)"/>
<rect x="20" y="452" width="320" height="46" rx="4" fill="#f7f7f7" stroke="#bbb"/>
<text x="180.0" y="471" text-anchor="middle" font-size="13" fill="#111">Append GC content</text>
<text x="180.0" y="487" text-anchor="middle" font-size="11" fill="#555">256 + 1 = 257</text>
<line x1="180.0" y1="498" x2="180.0" y2="518" stroke="#555" stroke-width="1.4" marker-end="url(#a)"/>
<rect x="20" y="524" width="320" height="46" rx="4" fill="#f7f7f7" stroke="#bbb"/>
<text x="180.0" y="543" text-anchor="middle" font-size="13" fill="#111">Dense 128, 64, 32</text>
<text x="180.0" y="559" text-anchor="middle" font-size="11" fill="#555">with batch normalisation</text>
<line x1="180.0" y1="570" x2="180.0" y2="590" stroke="#555" stroke-width="1.4" marker-end="url(#a)"/>
<rect x="20" y="596" width="320" height="46" rx="4" fill="#f7f7f7" stroke="#bbb"/>
<text x="180.0" y="615" text-anchor="middle" font-size="13" fill="#111">Output</text>
<text x="180.0" y="631" text-anchor="middle" font-size="11" fill="#555">1 unit</text>
</svg>